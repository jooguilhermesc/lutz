name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          mkdir -p web/dist
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check lutz tests
      - name: Pytest with coverage (gate: 80%)
        run: python -m pytest tests --cov=lutz --cov-report=term-missing --cov-fail-under=80

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build SPA (tsc + vite)
        run: |
          cd web
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  package:
    name: Package
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test of the wheel
        run: |
          pip install dist/*.whl
          lutz --version
          lutz init /tmp/demo --pergunta "smoke"
          lutz doctor --projeto /tmp/demo || true
          cd /tmp && python -c "import importlib.resources as r; assert r.files('lutz').joinpath('web', 'index.html').is_file()"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip bandit detect-secrets pip-audit
          mkdir -p web/dist
          pip install .
      - name: Bandit (fails on HIGH)
        run: bandit -r lutz --severity-level high --confidence-level medium
      - name: detect-secrets
        run: |
          detect-secrets scan --exclude-files '(\.git|dist|build|\.venv|node_modules|tests/|package-lock\.json|uv\.lock|specs/)' > secrets.json
          python - <<'PY'
          import json, sys
          r = json.load(open("secrets.json"))["results"]
          if r:
              for path, items in r.items():
                  for s in items:
                      print(f"::error::{path}:{s['line_number']} possível segredo ({s['type']})")
              sys.exit(1)
          print("detect-secrets: nenhum segredo encontrado")
          PY
      - name: pip-audit (dependencies)
        run: pip-audit --skip-editable --progress-spinner off

  agents:
    name: Agent definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate .claude/agents frontmatter
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          erros = []
          arquivos = sorted(pathlib.Path(".claude/agents").glob("*.md"))
          for f in arquivos:
              partes = f.read_text(encoding="utf-8").split("---", 2)
              if len(partes) < 3:
                  erros.append(f"{f}: sem frontmatter")
                  continue
              meta = yaml.safe_load(partes[1]) or {}
              for campo in ("name", "description", "tools"):
                  if campo not in meta:
                      erros.append(f"{f}: falta '{campo}'")
          for e in erros:
              print(f"::error::{e}")
          sys.exit(1 if erros or not arquivos else 0)
          PY
