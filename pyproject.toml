[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lutz-research"
version = "1.0.0a1"
description = "Validated data extraction for systematic reviews: per-cell confidence and a reliability report for PRISMA 2020"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["systematic-review", "data-extraction", "prisma", "inter-rater-reliability", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "krippendorff>=0.6",
    "rapidfuzz>=3.6",
    "openai>=1.30",
    "anthropic>=0.28",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    # Oracles used only by tests to cross-check our own metric implementations.
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.scripts]
lutz = "lutz.cli:cli"

[project.urls]
Repository = "https://github.com/jooguilhermesc/lutz"
Issues = "https://github.com/jooguilhermesc/lutz/issues"

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.hatch.build.targets.wheel]
packages = ["lutz"]

[tool.hatch.build.targets.wheel.force-include]
# Pre-built React SPA. Build before releasing: cd web && npm run build
"web/dist" = "lutz/web"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lutz"]
omit = ["lutz/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 80
